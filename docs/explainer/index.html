<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"safe","type":"color","label":"Safe","default":"#2FDB7A"},
    {"id":"problem","type":"color","label":"Problem","default":"#E54848"},
    {"id":"ink","type":"color","label":"Ink","default":"#F4F7F5"},
    {"id":"ground","type":"color","label":"Ground","default":"#0C1210"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0c1210;
        --ink: #f4f7f5;
        --safe: #2fdb7a;
        --problem: #e54848;
        --muted: #8a968e;
        --font-display: Outfit, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--ground);
        font-family: var(--font-display);
      }
      #illustration-label {
        position: absolute;
        left: 72px;
        bottom: 48px;
        z-index: 50;
        color: var(--muted);
        font-size: 28px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        pointer-events: none;
      }
      #illustration-label .label-inner {
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="18"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <div
        id="scene-pulse"
        data-composition-id="scene-pulse"
        data-composition-src="compositions/scene-pulse.html"
        class="clip"
        data-start="0"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="scene-generators"
        data-composition-id="scene-generators"
        data-composition-src="compositions/scene-generators.html"
        class="clip"
        data-start="4"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="scene-rules"
        data-composition-id="scene-rules"
        data-composition-src="compositions/scene-rules.html"
        class="clip"
        data-start="8"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="scene-gridsafe"
        data-composition-id="scene-gridsafe"
        data-composition-src="compositions/scene-gridsafe.html"
        class="clip"
        data-start="12"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="scene-end"
        data-composition-id="scene-end"
        data-composition-src="compositions/scene-end.html"
        class="clip"
        data-start="16"
        data-duration="2"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="illustration-label"
        class="clip"
        data-start="0"
        data-duration="18"
        data-track-index="2"
        data-track-kind="graphics"
      >
        <span class="label-inner">Illustration</span>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(
        "#illustration-label .label-inner",
        { opacity: 0 },
        { opacity: 1, duration: 0.25, ease: "power2.out" },
        0,
      );
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
