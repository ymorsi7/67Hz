# GridSafe model routing (one-line swaps)
# Distinct Gemini 4 models per job; never drop below two Gemini 4 models.

reader:
  model: gemini-4-neon
  # high spent ~7.5k thought tokens / ~76s on one LIPA page; low keeps structured extraction fast for demo.
  thinking_level: low
  job: "Extract typed interconnection constraints with page citations from PDFs, page images, and camera photos."

verifier:
  api: decisions
  model: gemini-decision-1
  confidence_threshold: 0.85
  readability_threshold: 0.60
  fallback_model: gemini-4-hydrogen
  fallback_active: false
  job: "Calibrated yes/no verification per extracted constraint against cited page image; abstain below threshold."

designer:
  model: gemini-4-hydrogen
  thinking_level: low
  job: "Fast parallel controller mutations in the evolve loop, and underlying model for managed agent gridsafe-engineer."

hardener:
  model: gemini-4-carbon
  thinking_level: high
  fallback_model: gemini-4-neon
  fallback_active: false
  job: "Background red-teaming and hardening agent; falls back to gemini-4-neon if unavailable."

managed_agent:
  id: gridsafe-engineer
  base_agent: antigravity-preview-09-2026
  model: gemini-4-hydrogen
  hardener_agent_id: gridsafe-hardener
  hardener_model: gemini-4-carbon
  repo_url: https://github.com/ymorsi7/67Hz
  # Feature flag: set false to keep job/harden behind local evolve if agents path is down.
  enable_agents: true

comparison:
  older_model: gemini-3.8-flash
